<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cherry Spins Admin</title><link rel="stylesheet" href="/admin.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main class="wrap">
<header class="top"><div class="brand">🍒 CHERRY SPINS</div><span class="tag">ADMIN ONLY</span></header>
<div class="eyebrow">Control center</div><h1>Панель управления</h1>
<section class="stats"><div class="stat"><small>Всего игроков</small><strong id="players">—</strong></div><div class="stat"><small>Всего начислено</small><strong id="issued">—</strong></div></section>
<section class="panel"><h2>Баланс игрока</h2>
<label for="telegramId">Telegram ID игрока</label><input id="telegramId" inputmode="numeric" placeholder="Например, 123456789">
<button id="find" style="width:100%;margin-top:10px">Найти игрока</button><div id="player"></div>
<label for="amount">Количество Cherry Points</label><input id="amount" type="number" min="1" max="100000000" step="1" placeholder="Например, 1000" disabled>
<div class="actions"><button id="credit" disabled>＋ Начислить</button><button id="debit" class="secondary" disabled>− Списать</button></div>
<div id="status" class="status" role="status"></div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Последние операции</h2><button id="refresh" class="secondary">Обновить</button></div><div id="history" style="margin-top:8px"><p class="muted">Загрузка…</p></div></section>
<p class="foot">Все изменения баланса выполняются на сервере и записываются в журнал. Не передавай доступ к Telegram-аккаунту другим людям.</p>
</main><script src="/admin.js"></script></body></html>
